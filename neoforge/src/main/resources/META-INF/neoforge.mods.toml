modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/MincraftEinstein/MapHUD/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "https://curseforge.com/minecraft/mc-mods/maphud"
    logoFile = "pack.png"
    credits = ""
    authors = "${mod_author}"
    description = '''${description}'''

[modProperties]
    fzzy_config = "${mod_id}"

[modproperties.modmenu]
    sources = "https://github.com/MincraftEinstein/MapHUD"
    links = [
        "mod_menu.modrinth=https://modrinth.com/mod/maphud",
        "mod_menu.curseforge=https://curseforge.com/minecraft/mc-mods/maphud",
        "mod_menu.discord=https://discord.gg/gSsaFAvrBM",
        "mod_menu.kofi=https://ko-fi.com/mincrafteinstein"
    ]

[[mixins]]
    config = "maphud.mixins.json"

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}, ${max_minecraft_version})"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies."${mod_id}"]]
    modId = "fzzy_config"
    type = "required"
    versionRange = "[${fzzy_config_version},)"
    ordering = "NONE"
    side = "CLIENT"
